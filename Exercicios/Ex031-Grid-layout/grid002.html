<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            grid-template-rows: repeat(3, 80px);
            grid-template-columns:repeat(3, 1fr) ;
            grid-auto-rows: 80px;
            grid-auto-flow: column; /* por padrão é row determina para onde o item implicito vai quebrar se vai ser coluna ou linha(row)*/
            grid-auto-columns: 1fr;
            gap: 10px;
            place-items: normal normal;
            place-content:normal normal;
            
        }
        div.item {
            border: 2px dashed red;
        }
        
    </style>
</head>
<body>
    <div class="container">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
    <div class="item">G</div>
    <div class="item">H</div>
    <div class="item">I</div>
    <div class="item">J</div><!--Esta letra esta no grid implicito-->
 
    </div>
</body>
</html>
